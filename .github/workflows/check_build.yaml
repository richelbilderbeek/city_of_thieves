# Check that the program can be built,
# that its tests pass and measure the code coverage
name: check_build

on:
  push:
  pull_request:

jobs:
  check_build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt, Boost, cppcheck and GraphViz
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtmultimedia5-dev libboost-all-dev cppcheck graphviz

      - name: make console_test
        run: make console_test

      - name: Run CityOfThievesConsoleTest
        run: ./Console/CityOfThievesConsoleTest

      - name: Measure code coverage
        run: |
          pip install gcovr
          gcovr --root . --filter 'Classes/' --print-summary --xml coverage.xml

      - name: Upload code coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: make console
        run: make console

      - name: make desktop
        run: make desktop

      - name: cppcheck, always passes
        run: cppcheck --quiet --error-exitcode=1 . || true

      - name: Install OCLint, always passes
        continue-on-error: true
        run: ./install_oclint.sh

      - name: Do OCLint, always passes
        continue-on-error: true
        run: ./do_oclint.sh
